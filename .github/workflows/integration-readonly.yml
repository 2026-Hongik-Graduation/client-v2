name: Production API Contract QA (Read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Compare FE API contracts against public EC2 OpenAPI
        env:
          QA_SKIP_LOCAL_OPENAPI: "1"
        run: npm run qa:integration:contract
      - name: Vercel and backend proxy anonymous read-only checks
        run: npm run qa:integration:deploy
